name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify hosted BOT Worker bundle
        if: ${{ hashFiles('apps/bot-worker/wrangler.toml') != '' }}
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --yes --package=wrangler@4.158.0 -- wrangler deploy --config apps/bot-worker/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/bot-worker-bundle"
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:production
      - run: npm audit --omit=dev --audit-level=high
